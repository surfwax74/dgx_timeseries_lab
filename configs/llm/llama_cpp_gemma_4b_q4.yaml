# CPU / tiny-GPU co-pilot using llama-cpp-python with Gemma 4B Q4_K_M GGUF.
# ~2.5 GB on disk — fits comfortably on air-gapped workstations without a
# capable GPU. Drop the GGUF into data/llm_weights/ via sneakernet first.
#
# Where to get the GGUF (verify current filename before sneakernet):
#   https://huggingface.co/google/gemma-3-4b-it        (official; convert to GGUF)
#   https://huggingface.co/bartowski                    (third-party GGUF mirror)
#   https://huggingface.co/lmstudio-community           (third-party GGUF mirror)
kind: llama_cpp
model_path: data/llm_weights/gemma-3-4b-it.Q4_K_M.gguf
n_ctx: 8192
n_gpu_layers: 0           # set to e.g. 20 on RTX 3080 to offload layers
n_threads: null
verbose: false
